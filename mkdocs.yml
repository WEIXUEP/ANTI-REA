site_name: ANTI-REA
site_description: Practical C++ and Python protection, auditing and reproducible measurements.
site_url: !ENV [ANTI_REA_SITE_URL, 'https://weixuep.github.io/ANTI-REA/']
repo_url: https://github.com/WEIXUEP/ANTI-REA
repo_name: WEIXUEP/ANTI-REA
edit_uri: ''
docs_dir: docs
site_dir: build/site
strict: true

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: teal
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.footer
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow

plugins:
  - search:
      lang:
        - en
        - zh

hooks:
  - src/anti_rea/site_hook.py

watch:
  - skills/cpp-leakage-audit
  - skills/cpp-code-protection
  - skills/python-code-protection
  - skills/python-leakage-audit
  - LICENSE

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

nav:
  - 简体中文:
      - 文档首页: index.zh-CN.md
      - 快速开始: quickstart.zh-CN.md
      - 威胁模型: threat-model.zh-CN.md
      - 泄露场景: scenarios.zh-CN.md
      - 诊断与恢复: diagnostics.zh-CN.md
      - 构建与集成: integration.zh-CN.md
      - 可选名称混淆: name-styles.zh-CN.md
      - 资源加密与缓存案例: runtime-resources.zh-CN.md
      - Python 保护与恢复: python-protection.zh-CN.md
      - Python 实测结果: python-results.zh-CN.md
      - xollvm 与函数选择: xollvm.zh-CN.md
      - Windows 构建: windows.zh-CN.md
      - 检测 Skill 使用指南: audit-skill.zh-CN.md
