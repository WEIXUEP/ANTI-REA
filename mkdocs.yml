site_name: ANTI-REA
site_description: Practical C++ information protection, auditing and reproducible measurements.
site_url: !ENV [ANTI_REA_SITE_URL, 'https://weixuep.github.io/ANTI-REA/']
repo_url: https://github.com/WEIXUEP/ANTI-REA
repo_name: WEIXUEP/ANTI-REA
edit_uri: ''
docs_dir: docs
site_dir: build/site
strict: true

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: teal
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.footer
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow

plugins:
  - search

hooks:
  - src/anti_rea/site_hook.py

watch:
  - skills/cpp-leakage-audit
  - skills/cpp-code-protection
  - LICENSE

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

nav:
  - Home: index.md
  - Getting Started:
      - Quickstart: quickstart.md
      - Threat Model: threat-model.md
      - Leakage Scenarios: scenarios.md
  - Protection:
      - Diagnostics and Recovery: diagnostics.md
      - Build and Integration: integration.md
      - xollvm and Function Selection: xollvm.md
      - Windows: windows.md
  - Leakage Detection Skill:
      - Using the Skill: audit-skill.md
      - Skill Instructions: skill/index.md
      - Independent Operations: skill/references/operations.md
      - Finding Interpretation: skill/references/interpretation.md
      - Audit Validation: skill/references/validation.md
      - Windows Audit: skill/references/windows.md
  - Code Protection Skill:
      - Using the Skill: using-protection-skill.md
      - Skill Instructions: protection-skill/index.md
      - Independent Operations: protection-skill/references/operations.md
      - Protection Integration: protection-skill/references/integration.md
      - Remediation Policy: protection-skill/references/remediation.md
      - Validation Guide: protection-skill/references/validation.md
      - Recovery Tool Design: protection-skill/references/recovery-tools.md
      - Key Generation and Lifecycle: protection-skill/references/key-management.md
      - Windows Validation: protection-skill/references/windows.md
  - Evidence:
      - Windows Native Results: windows-validation.md
      - Measurement Tools: measurement.md
      - Measured Results: comparison.md
      - Remaining Exposure: remaining-exposure.md
  - Publishing:
      - GitHub Pages: github-pages.md
