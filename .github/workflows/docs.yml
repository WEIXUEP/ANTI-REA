name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'skills/cpp-leakage-audit/**'
      - 'src/anti_rea/site_hook.py'
      - 'tests/test_docs.py'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'LICENSE'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'skills/cpp-leakage-audit/**'
      - 'src/anti_rea/site_hook.py'
      - 'tests/test_docs.py'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'LICENSE'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ANTI_REA_SITE_URL: ${{ vars.ANTI_REA_SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Test publication scope
        run: python -m unittest discover -s tests -p test_docs.py -v
      - name: Build and validate documentation
        run: python -m mkdocs build --strict
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v5
