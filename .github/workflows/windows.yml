name: Windows native acceptance (operator toolchain)
on:
  push:
    branches: [main]
    paths: ['src/**', 'tools/**', 'tests/**', 'examples/**', 'cmake/**', 'skills/**', 'CMakeLists.txt', '.github/workflows/windows.yml']
  pull_request:
    paths: ['src/**', 'tools/**', 'tests/**', 'examples/**', 'cmake/**', 'skills/**', 'CMakeLists.txt', '.github/workflows/windows.yml']
  workflow_dispatch:
    inputs:
      llvm_bin:
        description: Installed clang-cl, opt and llvm-undname directory
        required: true
        type: string
      sodium_prefix:
        description: libsodium prefix containing include, lib and bin
        required: true
        type: string
      sodium_library:
        description: Optional explicit MSVC libsodium import library
        required: false
        type: string
      sodium_runtime:
        description: Optional libsodium DLL to include in fresh test packages
        required: false
        type: string
permissions:
  contents: read
jobs:
  scanner:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test portable tools and standalone skill on Windows
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p 'test_*.py' -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
  native:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v6
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Prepare Python
        shell: pwsh
        run: |
          python -m venv .venv
          .venv/Scripts/python -m pip install -r requirements.txt
      - name: Build and test
        shell: pwsh
        env:
          LLVM_BIN: ${{ inputs.llvm_bin }}
          SODIUM_PREFIX: ${{ inputs.sodium_prefix }}
          SODIUM_LIBRARY: ${{ inputs.sodium_library }}
          SODIUM_RUNTIME: ${{ inputs.sodium_runtime }}
        run: |
          $arguments = @('tools/validate_windows.py', '--llvm-bin', $env:LLVM_BIN, '--sodium-prefix', $env:SODIUM_PREFIX)
          if ($env:SODIUM_LIBRARY) { $arguments += @('--sodium-library', $env:SODIUM_LIBRARY) }
          if ($env:SODIUM_RUNTIME) { $arguments += @('--sodium-runtime', $env:SODIUM_RUNTIME) }
          & .venv/Scripts/python @arguments
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # Full evidence contains private keys, IR and maps; never upload it.
