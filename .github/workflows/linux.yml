name: Linux protection example
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang-18 llvm-18 ninja-build libsodium-dev python3-venv
      - name: Prepare Python
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
      - name: Build, test, install and audit
        run: .venv/bin/python tools/anti_rea.py compare --compiler /usr/lib/llvm-18/bin/clang++ --presets baseline stripped protected --jobs 8
      - name: Archive sanitized summary only
        uses: actions/upload-artifact@v4
        with:
          name: linux-summary
          path: build/comparison.md
